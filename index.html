<html lang="he" dir="rtl"><head>
<meta charset="utf-8">

<meta name="version" content="2026-10-07-restaurant-ui-v3">
<title>השף הגדול</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e8dfd2;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;touch-action:none;color:#2b211b}
button{font:inherit;border:0;cursor:pointer}.game{position:fixed;inset:0;z-index:0;display:block;background:#b9d7d1}.game canvas{display:block!important;position:absolute!important;inset:0!important;width:100%!important;height:100%!important;z-index:0!important}
.top{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;height:58px;z-index:8;display:flex;align-items:center;gap:7px;pointer-events:none}

.levelbox{position:absolute;right:0;top:52px;width:135px;height:7px;border-radius:10px;background:#0002;overflow:hidden}.levelbox i{display:block;height:100%;width:0;background:#e7a62b;border-radius:10px}
.restaurant-name{display:none!important}
.iconbtn{width:46px;height:46px;border-radius:15px;background:#fffaf4;color:#51362a;box-shadow:0 4px 14px #49372a22;font-size:21px;pointer-events:auto}.top .iconbtn:first-child{margin-right:auto}
.side{position:fixed;right:10px;top:78px;z-index:7;display:flex;flex-direction:column;gap:8px}.side button{width:48px;height:48px;border-radius:15px;background:#fffaf4;box-shadow:0 4px 14px #49372a22;font-size:21px}
.bottom{position:fixed;left:9px;right:9px;bottom:max(9px,env(safe-area-inset-bottom));z-index:9;height:70px;background:#fffaf4F2;border:1px solid #fff;border-radius:22px;box-shadow:0 8px 28px #3a281d35;display:grid;grid-template-columns:repeat(4,1fr);padding:5px;gap:5px}
.nav{background:transparent;border-radius:17px;color:#7a6659;font-size:11px;font-weight:900;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px}.nav span{font-size:23px}.nav.active{background:#f1dfc9;color:#7b3f25}
.panel{position:fixed;z-index:20;right:10px;left:10px;bottom:89px;max-height:min(62vh,520px);overflow:auto;background:#fffaf5;border-radius:24px;box-shadow:0 18px 60px #2d211a55;border:1px solid #fff;display:none;padding:15px}.panel.show{display:block}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.panel-head h2{margin:0;font-size:21px}.close{width:36px;height:36px;border-radius:12px;background:#eee2d6;font-size:18px}
.order{display:flex;align-items:center;gap:9px;padding:10px;background:#f5ede4;border-radius:16px;margin:7px 0}.food{width:46px;height:46px;border-radius:14px;background:#fff;display:grid;place-items:center;font-size:27px}.order-main{flex:1;min-width:0}.order-main b{display:block;font-size:14px}.order-main small{color:#8b786b}.cookbtn{background:#d86136;color:#fff;border-radius:12px;padding:9px 12px;font-weight:900}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:9px}.cardx{background:#f5ede4;border-radius:17px;padding:13px;text-align:center}.cardx .big{font-size:32px}.cardx b{display:block;margin:4px}.buy{background:#7b3f25;color:white;border-radius:11px;padding:8px 10px;font-weight:900;width:100%}
#toast{position:fixed;z-index:40;left:50%;bottom:172px;transform:translateX(-50%);background:#30231c;color:#fff;padding:11px 16px;border-radius:16px;font-weight:800;box-shadow:0 8px 25px #0004;opacity:0;transition:.2s;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}#toast.show{opacity:1}
#stick{position:fixed;z-index:10;left:18px;bottom:91px;width:112px;height:112px;border-radius:50%;background:#ffffff36;border:2px solid #fff8;box-shadow:0 5px 20px #0002}.knob{position:absolute;left:30px;top:30px;width:48px;height:48px;border-radius:50%;background:#fff;box-shadow:0 5px 18px #0003}
#cook{position:fixed;inset:0;z-index:50;background:#1d1510aa;display:none;align-items:flex-end;justify-content:center;padding:14px}.cookcard{width:min(440px,100%);background:#fffaf5;border-radius:27px;padding:20px;box-shadow:0 -5px 40px #0004;text-align:center}.dishbig{font-size:58px}.cookbar{height:13px;background:#eadfd4;border-radius:20px;overflow:hidden;margin:15px 0}.cookbar i{display:block;width:0;height:100%;background:#d86136;border-radius:20px}.serve{width:100%;padding:14px;background:#d86136;color:white;border-radius:15px;font-weight:900}
#start{display:none!important}.startcard{position:relative;z-index:100000;pointer-events:auto;width:min(420px,100%);background:#fffaf5;border-radius:32px;padding:28px 22px;text-align:center;box-shadow:0 25px 80px #1e110b66}.logo{width:92px;height:92px;border-radius:28px;margin:0 auto 10px;background:#f0dcc7;display:grid;place-items:center;font-size:55px}.startcard h1{font-size:34px;margin:8px 0 4px}.startcard p{color:#79675b;line-height:1.55;margin:0 0 18px}.startbtn{position:relative;z-index:100001;pointer-events:auto;touch-action:manipulation;-webkit-tap-highlight-color:transparent;width:100%;padding:16px;border-radius:16px;background:#d86136;color:white;font-weight:900;font-size:17px;box-shadow:0 6px 18px #d8613644}
.hint{margin-top:10px;font-size:12px;color:#9b887a}
@media(max-width:380px){.stat{min-width:61px;padding:5px 7px;font-size:12px}.restaurant-name{font-size:12px}.bottom{height:66px}.nav span{font-size:21px}}
</style></head><body>
<div id="game" class="game"></div>

<div class="top">
<button class="iconbtn" data-action="orders">🍽️</button>

<div class="stat gold">💰 <b id="money">120</b></div><div class="stat">⭐ <b id="xp">0</b></div><div class="stat">🏆 <b id="lvl">1</b></div>
<div class="levelbox"><i id="fill"></i></div>
</div>

<div class="side"><button data-action="shop">🛒</button><button data-action="staff">👨‍🍳</button><button data-action="design">🪑</button></div>

<div id="panel" class="panel"></div>

<div class="bottom">
<button class="nav active" data-action="home"><span>🏠</span>מסעדה</button>
<button class="nav" data-action="orders"><span>🍽️</span>הזמנות</button>
<button class="nav" data-action="shop"><span>🛒</span>שדרוגים</button>
<button class="nav" data-action="staff"><span>👨‍🍳</span>צוות</button>
</div>

<div id="stick"><div id="knob" class="knob"></div></div><div id="toast"></div>
<div id="cook"><div class="cookcard"><div id="dishbig" class="dishbig">🍳</div><h2 id="cookTitle">מכינים...</h2><div class="cookbar"><i id="cookBar"></i></div><button class="serve" data-action="finish">הגש ללקוח</button></div></div>

<script>
(function(){
  function bindStart(){
    const b=document.getElementById('startBtn');
    if(!b)return;
    const go=function(e){
      if(e){e.preventDefault();e.stopPropagation();}
      if(typeof window.startGame==='function'){window.startGame(e);}
      else{
        b.textContent='טוען את המשחק...';
        setTimeout(function(){
          if(typeof window.startGame==='function') window.startGame(e);
          else { b.disabled=false; b.textContent='נסה שוב'; }
        },250);
      }
    };
    b.addEventListener('pointerup',go,true);
    b.addEventListener('touchend',go,{capture:true,passive:false});
    b.addEventListener('click',go,true);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',bindStart);
  else bindStart();
})();
</script>
<script src="./three.min.js"></script>
<script>
let scene,camera,renderer,chef,customers=[],started=false,money=120,xp=0,level=1,staff=0,decor=0,orders=[],cooking=false,cookOrder=null,ct;
const keys={x:0,z:0};
const dishes=[['🍔','המבורגר',28],['🍕','פיצה',34],['🍝','פסטה',31],['🥗','סלט',22],['🍰','עוגה',38],['🍗','עוף צלוי',42]];
function box(w,h,d,c,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c,roughness:.72}));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}
function init(){
 scene=new THREE.Scene();scene.background=new THREE.Color(0xb9d7d1);scene.fog=new THREE.Fog(0xb9d7d1,32,72);
 camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,150);camera.position.set(12,22,22);camera.lookAt(0,0,1);
 renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setClearColor(0xb9d7d1,1);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.domElement.style.pointerEvents='none';renderer.shadowMap.enabled=true;document.getElementById('game').appendChild(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0xfff5e6,0x607060,2));const sun=new THREE.DirectionalLight(0xfff1d2,2.4);sun.position.set(12,25,8);sun.castShadow=true;scene.add(sun);
 box(50,.4,50,0x78a96a,0,-.25,0);
 box(8,.18,30,0xcbbda9,0,-.05,2);box(30,.18,5,0xcbbda9,0,-.04,10);box(12,.12,6,0xd8c9b5,0,-.02,13);
 box(18,3.4,8,0xf2e1ca,0,1.7,-7);box(18.5,.45,9,0x6d3d2b,0,3.65,-7);box(18,.35,.25,0x5a3327,0,2.1,-2.9);
 box(.45,3.2,.45,0x6a4636,-8.5,1.6,-2.7);box(.45,3.2,.45,0x6a4636,8.5,1.6,-2.7);
 box(5,2.8,.18,0x8fcbd2,-5.7,1.55,-2.88);box(5,2.8,.18,0x8fcbd2,5.7,1.55,-2.88);box(2.8,2.9,.2,0x9ed6da,0,1.5,-2.9);
 // kitchen
 box(15,.85,1.6,0x765447,0,.85,-8);for(let i=-4.8;i<=4.8;i+=2.4)box(1.65,1.55,1.15,0x3b302c,i,1.15,-7);for(let i=-4.8;i<=4.8;i+=2.4)box(1.25,.12,.95,0xf08b43,i,1.95,-7);
 box(2.1,.9,1.4,0x9b735f,-6.6,.9,-5.8);box(2.1,.9,1.4,0x9b735f,6.6,.9,-5.8);box(2.2,.85,1.2,0x6f8b8b,-3.6,.9,-5.8);
 box(8,.95,.75,0x9c6848,0,.95,-4.7);box(8,.12,.82,0xe8c16a,0,1.48,-4.7);
 // dining
 for(let x=-6;x<=6;x+=6)for(let z=-.5;z<=5.5;z+=3){box(2.4,.22,1.4,0x9a6548,x,.9,z);for(const dx of [-.9,.9])for(const dz of [-.62,.62])box(.28,.72,.28,0x65402f,x+dx,.4,z+dz)}
 box(3.2,.04,1.5,0x9c6a42,0,.02,-1.2);
 // restroom
 box(3.2,2.5,3.2,0xe9d8c2,7,1.25,3.8);box(3,1.8,.18,0x8fc7cf,7,1.45,2.15);box(1,1.1,.2,0x5a3a2f,7,1.2,2);
 box(.85,.45,.85,0xffffff,6.25,.35,3.3);box(.85,.45,.85,0xffffff,7.75,.35,3.3);box(1,.8,.8,0x8b8b8b,7,.4,4.35);
 // trash
 box(1.25,1.5,1.25,0x38443e,-8,.75,5.6);box(1.05,.12,1.05,0x1f2825,-8,1.52,5.6);box(.45,.45,.08,0xf0d36a,-8,1.58,5.6);
 for(let i=-2;i<=2;i++){box(.7,.5,.7,0xa45d42,i*4,.25,11);box(1.2,1.8,1.2,0x4f8050,i*4,.95,11)}
 box(2.4,1,.12,0x5a3a2f,0,2.65,-2.75);box(2,.8,.12,0xe8c16a,0,2,-4.55);
 chef=new THREE.Group();chef.position.set(0,0,7);scene.add(chef);makeChef(chef);
 customers=[];
 const seats=[[-6,-.5,1],[0,-.5,1],[6,-.5,1],[-6,5.5,-1],[0,5.5,-1],[6,5.5,-1]];
 seats.forEach((s,i)=>{const p=new THREE.Group();p.position.set(s[0],0,s[1]);p.rotation.y=s[2]>0?Math.PI:0;p.userData.state='seated';p.userData.id=i;makePerson(p,[0xf0c29f,0x8d5a3b,0xd89b72,0xf0c29f,0x9b6b45,0xd6a27a][i],[0x315c9a,0x8f3f35,0x4d6a3a,0x6b4b9b,0x315c9a,0x9a6a2f][i],0x3e4148,true);scene.add(p);customers.push(p)})
 window.addEventListener('resize',resize);animate();setTimeout(spawnOrder,1200);
}
function makePerson(g,skin,shirt,pants,seated=false){const body=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.8,4,8),new THREE.MeshStandardMaterial({color:shirt,roughness:.8}));body.position.y=seated?.88:1.05;body.castShadow=true;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.34,16,12),new THREE.MeshStandardMaterial({color:skin,roughness:.85}));head.position.y=seated?1.7:1.95;head.castShadow=true;g.add(head);const leg1=new THREE.Mesh(new THREE.BoxGeometry(.18,.65,.18),new THREE.MeshStandardMaterial({color:pants}));leg1.position.set(-.18,seated?.25:.35,0);g.add(leg1);const leg2=leg1.clone();leg2.position.x=.18;g.add(leg2);const arm1=new THREE.Mesh(new THREE.BoxGeometry(.16,.6,.16),new THREE.MeshStandardMaterial({color:skin}));arm1.position.set(-.52,seated?.92:1.05,0);g.add(arm1);const arm2=arm1.clone();arm2.position.x=.52;g.add(arm2)}
function makeChef(g){makePerson(g,0xf0c29f,0x315c9a,0xffffff);const hat=new THREE.Mesh(new THREE.CylinderGeometry(.48,.38,.28,20),new THREE.MeshStandardMaterial({color:0xffffff}));hat.position.y=2.38;hat.castShadow=true;g.add(hat)}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
function startGame(event){try{started=true;init();toast('המסעדה נפתחה! הלקוח הראשון נכנס.');renderPanel('orders')}catch(e){console.error(e);toast('תקלה בהפעלת המשחק')}}
window.addEventListener('load',function(){setTimeout(function(){startGame();},50)});
function spawnOrder(){if(!started)return;if(orders.length<5){const d=dishes[Math.floor(Math.random()*dishes.length)];orders.push({id:Date.now()+Math.random(),dish:d,tip:Math.floor(Math.random()*12)});sync()}renderPanel('orders');setTimeout(spawnOrder,4500+Math.random()*3500)}
document.addEventListener('click',function(e){const el=e.target.closest('[data-action],[data-cook]');if(!el)return;e.preventDefault();e.stopPropagation();const id=el.getAttribute('data-cook');if(id!==null){cook(id);return}const a=el.getAttribute('data-action');if(a==='home'||a==='close')closePanel();else if(a==='orders'||a==='shop'||a==='staff'||a==='design')openPanel(a==='design'?'design':a);else if(a==='upgrade')buyUpgrade();else if(a==='decor')buyDecor();else if(a==='hire')hire();else if(a==='cleaner')toast('מנקה ייפתח ברמה 3');else if(a==='finish')finishCook();},true);function openPanel(type){renderPanel(type);document.getElementById('panel').classList.add('show')}
function closePanel(){document.getElementById('panel').classList.remove('show')}
function renderPanel(type){
 const p=document.getElementById('panel');
 if(type==='orders'){p.innerHTML='<div class="panel-head"><h2>🍽️ הזמנות פעילות</h2><button class="close" data-action="close">✕</button></div>'+ (orders.length?orders.map(o=>'<div class="order"><div class="food">'+o.dish[0]+'</div><div class="order-main"><b>'+o.dish[1]+'</b><small>💰 ₪'+(o.dish[2]+o.tip)+' • לקוח ממתין</small></div><button class="cookbtn" data-cook="'+o.id+'">לבשל</button></div>').join(''):'<p style="text-align:center;color:#8b786b;padding:25px">אין הזמנות כרגע. הלקוחות בדרך.</p>')}
 if(type==='shop'){p.innerHTML='<div class="panel-head"><h2>🛒 שדרוג המסעדה</h2><button class="close" data-action="close">✕</button></div><div class="cards"><div class="cardx"><div class="big">🔥</div><b>מטבח מהיר</b><small>מזרז בישול</small><button class="buy" data-action="upgrade">₪'+(150+level*80)+'</button></div><div class="cardx"><div class="big">🪑</div><b>שולחנות חדשים</b><small>יותר לקוחות</small><button class="buy" data-action="decor">₪'+(60+decor*30)+'</button></div></div>'}
 if(type==='staff'){p.innerHTML='<div class="panel-head"><h2>👨‍🍳 צוות</h2><button class="close" data-action="close">✕</button></div><div class="cards"><div class="cardx"><div class="big">👨‍🍳</div><b>טבח</b><small>מייעל את המטבח</small><button class="buy" data-action="hire">העסק ₪'+(100+staff*80)+'</button></div><div class="cardx"><div class="big">🧹</div><b>מנקה</b><small>שומר על המסעדה</small><button class="buy" data-action="cleaner">רמה 3</button></div></div>'}
}
function cook(id){if(cooking)return;const o=orders.find(x=>x.id==id);if(!o)return;cooking=true;cookOrder=o;o.ready=false;document.getElementById('cook').style.display='flex';document.getElementById('dishbig').textContent=o.dish[0];document.getElementById('cookTitle').textContent='מכינים '+o.dish[1]+' במטבח';let t=0;ct=setInterval(()=>{t+=4;document.getElementById('cookBar').style.width=t+'%';if(t>=100){clearInterval(ct);o.ready=true;cooking=false;document.getElementById('cookTitle').textContent='המנה מוכנה — גש ללקוח';document.querySelector('.serve').textContent='הגש ללקוח';toast('הצלחת מוכנה. גש לשולחן והגש אותה')}},140)}
function finishCook(){const o=cookOrder;if(!o||!o.ready)return toast('סיים קודם את הבישול');const target=customers.find(c=>c.userData.id===Math.floor(o.id)%customers.length)||customers[0];if(Math.hypot(chef.position.x-target.position.x,chef.position.z-target.position.z)>3){toast('התקרב ללקוח היושב ליד השולחן כדי להגיש');return}orders=orders.filter(x=>x.id!==o.id);money+=o.dish[2]+o.tip;xp+=10+o.tip;while(xp>=level*100){xp-=level*100;level++;money+=50;toast('עלית לרמה '+level+'! בונוס ₪50')}target.userData.state='eating';cooking=false;document.getElementById('cook').style.display='none';document.getElementById('cookBar').style.width='0';cookOrder=null;sync();renderPanel('orders');toast('הגשת '+o.dish[1]+' ללקוח! +₪'+(o.dish[2]+o.tip))}
function buyUpgrade(){const c=150+level*80;if(money<c)return toast('חסרים ₪'+(c-money));money-=c;xp+=30;toast('המטבח שודרג!');sync();renderPanel('shop')}
function hire(){const c=100+staff*80;if(money<c)return toast('חסרים ₪'+(c-money));money-=c;staff++;toast('הטבח החדש הצטרף לצוות!');sync();renderPanel('staff')}
function buyDecor(){const c=60+decor*30;if(money<c)return toast('חסרים ₪'+(c-money));money-=c;decor++;box(1,.8,1,0x9d684a,-8+(decor%6)*3,.6,10-Math.floor(decor/6)*3);toast('נוסף עיצוב חדש למסעדה');sync();renderPanel('shop')}
function sync(){document.getElementById('money').textContent=money;document.getElementById('xp').textContent=xp;document.getElementById('lvl').textContent=level;document.getElementById('fill').style.width=Math.min(100,xp/(level*100)*100)+'%';}
function toast(s){const e=document.getElementById('toast');e.textContent=s;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),1900)}
function move(){if(!chef)return;const sp=.11*(staff?1.08:1);chef.position.x+=keys.x*sp;chef.position.z+=keys.z*sp;chef.position.x=Math.max(-14,Math.min(14,chef.position.x));chef.position.z=Math.max(-1,Math.min(14,chef.position.z));camera.position.x+=(chef.position.x+10-camera.position.x)*.035;camera.position.z+=(chef.position.z+15-camera.position.z)*.035;camera.lookAt(chef.position.x,.4,chef.position.z);}
const stick=document.getElementById('stick'),knob=document.getElementById('knob');let sid=null;
function pointer(e){const r=stick.getBoundingClientRect();let x=e.clientX-r.left-r.width/2,z=e.clientY-r.top-r.height/2,l=Math.hypot(x,z),m=43;if(l>m){x=x/l*m;z=z/l*m}knob.style.transform='translate('+x+'px,'+z+'px)';keys.x=x/m;keys.z=z/m}
stick.addEventListener('pointerdown',e=>{sid=e.pointerId;stick.setPointerCapture(sid);pointer(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===sid)pointer(e)});stick.addEventListener('pointerup',()=>{sid=null;knob.style.transform='';keys.x=keys.z=0});
function animate(){requestAnimationFrame(animate);move();if(renderer)renderer.render(scene,camera)}
sync();
</script></body></html>
