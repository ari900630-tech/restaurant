<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>השף הגדול</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="c"></canvas>

  <div id="ui">
    <div id="hud">💰 <span id="money">0</span> | 🎯 <span id="xp">0</span>/<span id="xplvl">100</span> | LV <span id="lvl">1</span></div>
    <div id="joy"><i>◉</i></div>
    <div id="actions"></div>
    <button id="menu">☰</button>
  </div>

  <div id="panel"></div>

  <div id="engine-error" style="display:none">
    <div id="engine-message"></div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
    window.THREE = THREE;

    const script = document.createElement('script');
    script.src = './game.js';
    script.onload = () => console.log('Game loaded');
    script.onerror = () => {
      const box = document.getElementById('engine-error');
      const msg = document.getElementById('engine-message');
      msg.textContent = 'המשחק עצמו לא נטען. לחץ על רענון ונסה שוב.';
      box.style.display = 'grid';
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
