<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>השף הגדול</title><link rel="stylesheet" href="styles.css"></head><body><canvas id="c"></canvas><header><span>💰 <b id="money">8420</b> ₪</span><span>⭐ <b id="xp">0</b></span><span>🏆 <b id="lvl">1</b></span><button id="sound">🔊</button></header><div id="orders"></div><div id="actions"></div><div id="joy"><i></i></div><nav><button data-p="rest">🍴<small>מסעדה</small></button><button data-p="orders">📋<small>הזמנות</small></button><button data-p="up">⬆️<small>שדרוגים</small></button><button data-p="staff">👥<small>צוות</small></button></nav><section id="panel"></section><div id="engine-error" style="display:none;position:fixed;inset:0;z-index:99;background:#140e0a;color:#fff;place-content:center;text-align:center;padding:28px;font-family:system-ui"><div><div style="font-size:48px">🍽️</div><h2>השף הגדול</h2><p id="engine-message">טוען את המשחק…</p><button onclick="location.reload()" style="padding:12px 22px;border:0;border-radius:12px">רענון</button></div></div><script>
(function(){
 const box=document.getElementById('engine-error'),msg=document.getElementById('engine-message'); let started=false;
 function show(t){msg.textContent=t;box.style.display='grid'}
 window.addEventListener('error',e=>{if(started)show('שגיאה במשחק: '+(e.message||'שגיאת JavaScript'))});
 window.addEventListener('unhandledrejection',e=>show('שגיאה במשחק: '+(e.reason&&e.reason.message||'שגיאה לא צפויה')));
 async function load(url){try{const mod=await import(url);window.THREE=mod;started=true;const s=document.createElement('script');s.src='game.js?v=33';s.onerror=()=>show('המשחק עצמו לא נטען.');document.body.appendChild(s);return true}catch(e){return false}}
 (async()=>{if(await load('https://cdn.skypack.dev/three@0.180.0'))return;if(await load('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js'))return;if(await load('https://unpkg.com/three@0.180.0/build/three.module.js'))return;show('לא ניתן לטעון את מנוע התלת־ממד. נסה שוב.');})();
 setTimeout(()=>{if(!started)show('טעינת מנוע התלת־ממד נכשלה. לחץ על רענון ונסה שוב.');},10000);
})();</script></body></html>
