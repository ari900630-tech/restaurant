<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>השף הגדול</title><link rel="stylesheet" href="styles.css"></head><body><canvas id="c"></canvas><header><span>💰 <b id="money">8420</b> ₪</span><span>⭐ <b id="xp">0</b></span><span>🏆 <b id="lvl">1</b></span><button id="sound">🔊</button></header><div id="orders"></div><div id="actions"></div><div id="joy"><i></i></div><nav><button data-p="rest">🍴<small>מסעדה</small></button><button data-p="orders">📋<small>הזמנות</small></button><button data-p="up">⬆️<small>שדרוגים</small></button><button data-p="staff">👥<small>צוות</small></button></nav><section id="panel"></section><div id="engine-error" style="display:none;position:fixed;inset:0;z-index:99;background:#140e0a;color:#fff;place-content:center;text-align:center;padding:28px;font-family:system-ui"><div><div style="font-size:48px">🍽️</div><h2>השף הגדול</h2><p>לא הצלחנו לטעון את מנוע התלת־ממד. נסה לרענן את המשחק.</p><button onclick="location.reload()" style="padding:12px 22px;border:0;border-radius:12px">רענון</button></div></div><script>
function startGame(){
  if(window.__gameStarted)return;
  window.__gameStarted=true;
  var s=document.createElement('script');
  s.src='game.js';
  s.onerror=function(){document.getElementById('engine-error').style.display='grid'};
  document.body.appendChild(s);
}
function loadFallback(){
  var s=document.createElement('script');
  s.src='https://unpkg.com/three@0.180.0/build/three.min.js';
  s.onload=startGame;
  s.onerror=function(){document.getElementById('engine-error').style.display='grid'};
  document.head.appendChild(s);
}
</script><script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js" onload="startGame()" onerror="loadFallback()"></script></body></html>
